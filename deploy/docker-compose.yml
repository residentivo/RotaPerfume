# Deploy do rotaperfumes (API Go + frontend Next.js atras de um Caddy HTTPS).
#
#   cd deploy
#   TURNSTILE_SITE_KEY=... docker compose -p rotaperfumes up -d --build --remove-orphans
#
# Variaveis de interpolacao (shell do Jenkins ou deploy/.env):
#   SITE_HOST          hostname da LAN          (default ivo-inspiron-15-3530)
#   SITE_IP            IP da LAN                (default 192.168.168.106)
#   HTTPS_PORT         porta HTTPS publicada no host (default 8443). Atende LAN,
#                      https://localhost e o Cloudflare Tunnel (cloudflared no
#                      host -> https://localhost:8443, noTLSVerify)
#   PUBLIC_URL        origem da API embutida no bundle. Default "/" = mesma
#                      origem (URLs relativas): serve a LAN e o dominio do tunnel.
#   TURNSTILE_SITE_KEY chave PUBLICA do Turnstile (embutida no bundle)
#
# O MariaDB roda no HOST (fora do compose): a API acessa via host.docker.internal.
# Segredos da API ficam em ./api.env (gerado pelo Jenkins, nunca versionado).
#
# SEC-29 (TLS API <-> banco; producao = MySQL 8.0 do host na 3306): a CA e
# montada DIRETO do host, pelo caminho absoluto
#   DB_TLS_CA_HOST_PATH  (default /etc/mysql/ssl/ca.pem; parametro do Jenkins)
# O bind e resolvido pelo daemon no HOST, entao funciona com o Jenkins em
# container (usando o socket do host) e nativo. Arquivo inexistente faz o
# "up" falhar (create_host_path: false) em vez de criar um diretorio.
# Como o host.docker.internal pode nao estar no SAN, o nome conferido e
#   DB_TLS_SERVER_NAME   (default: SITE_IP) - precisa estar no SAN
# Ver docs/Instal_SSL.md.

name: rotaperfumes

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rotaperfumes-api:latest
    # O arquivo so existe durante o deploy (o Jenkins grava e apaga). Para
    # comandos manuais sem ele (build/ps/logs/down) use API_ENV_FILE=/dev/null.
    # NAO rode "up" manual com /dev/null: o container da API seria recriado sem
    # as variaveis. Sem API_ENV_FILE e sem ./api.env o compose falha (de proposito).
    env_file:
      - ${API_ENV_FILE:-./api.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      # SEC-29: sha256 da CA (exportado pelo Jenkins no Deploy). Mudou a CA,
      # muda a label e o compose recria o container (o bind de arquivo fica
      # preso ao inode antigo; so conteudo novo nao dispara recriacao).
      rotaperfumes.db-ca-sha256: ${DB_CA_SHA256:-}
    environment:
      # IMG-01: imagens de produto no volume nomeado (o container e read_only).
      PRODUTO_IMAGENS_DIR: /data/produtos-imagens
      # SEC-29: TLS com o banco. Fixados aqui (ganham do api.env) para
      # casar com o bind mount abaixo; ver docs/deploy-servidor.md.
      DB_TLS_CA: /etc/rotaperfumes/db-ca.pem
      DB_TLS_SERVER_NAME: ${DB_TLS_SERVER_NAME:-${SITE_IP:-192.168.168.106}}
    volumes:
      - produto_imagens:/data/produtos-imagens
      # SEC-29: CA do banco no HOST (publica; 644 para o uid 65532 da
      # distroless ler). Caminho absoluto: resolvido pelo daemon no host.
      - type: bind
        source: ${DB_TLS_CA_HOST_PATH:-/etc/mysql/ssl/ca.pem}
        target: /etc/rotaperfumes/db-ca.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Sem healthcheck: a imagem distroless nao tem shell/curl. O Jenkins faz
    # o smoke test em /api/health atraves do Caddy.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # "/" vira "" no frontend (remove a barra final) -> fetch("/api/...").
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-/}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: rotaperfumes-frontend:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # Caddyfile embutido na imagem (em vez de bind mount): funciona mesmo se o
    # Jenkins rodar em container, onde o path do workspace nao existe no host.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: rotaperfumes-caddy:latest
    depends_on:
      - api
      - frontend
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_HOST: ${SITE_HOST:-ivo-inspiron-15-3530}
      SITE_IP: ${SITE_IP:-192.168.168.106}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
  # IMG-01: imagens de produto (dono 65532, criado no backend/Dockerfile).
  produto_imagens:
