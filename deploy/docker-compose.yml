# Deploy do rotaperfumes (API Go + frontend Next.js atras de um Caddy HTTPS).
#
#   cd deploy
#   TURNSTILE_SITE_KEY=... docker compose -p rotaperfumes up -d --build --remove-orphans
#
# Variaveis de interpolacao (shell do Jenkins ou deploy/.env):
#   SITE_HOST          hostname da LAN          (default ivo-inspiron-15-3530)
#   SITE_IP            IP da LAN                (default 192.168.168.106)
#   HTTPS_PORT         porta HTTPS publicada no host (default 8443). Atende LAN,
#                      https://localhost e o Cloudflare Tunnel (cloudflared no
#                      host -> https://localhost:8443, noTLSVerify)
#   PUBLIC_URL        origem da API embutida no bundle. Default "/" = mesma
#                      origem (URLs relativas): serve a LAN e o dominio do tunnel.
#   TURNSTILE_SITE_KEY chave PUBLICA do Turnstile (embutida no bundle)
#
# O MySQL roda no HOST (fora do compose): a API acessa via host.docker.internal.
# Segredos da API ficam em ./api.env (gerado pelo Jenkins, nunca versionado).

name: rotaperfumes

services:
  api:
    build:
      context: ../apis
      dockerfile: Dockerfile
    image: rotaperfumes-api:latest
    # O arquivo so existe durante o deploy (o Jenkins grava e apaga). Para
    # comandos manuais sem ele (build/ps/logs/down) use API_ENV_FILE=/dev/null.
    # NAO rode "up" manual com /dev/null: o container da API seria recriado sem
    # as variaveis. Sem API_ENV_FILE e sem ./api.env o compose falha (de proposito).
    env_file:
      - ${API_ENV_FILE:-./api.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Sem healthcheck: a imagem distroless nao tem shell/curl. O Jenkins faz
    # o smoke test em /api/health atraves do Caddy.
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # "/" vira "" no frontend (remove a barra final) -> fetch("/api/...").
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-/}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: rotaperfumes-frontend:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # Caddyfile embutido na imagem (em vez de bind mount): funciona mesmo se o
    # Jenkins rodar em container, onde o path do workspace nao existe no host.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: rotaperfumes-caddy:latest
    depends_on:
      - api
      - frontend
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_HOST: ${SITE_HOST:-ivo-inspiron-15-3530}
      SITE_IP: ${SITE_IP:-192.168.168.106}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
