# SETUP-01: fonte única das versões do ambiente de desenvolvimento.
# Lido por scripts/setup-linux.sh e scripts/setup-windows.ps1 (formato CHAVE=valor,
# sem aspas e sem espaços; linhas com "#" são comentário).
#
# Versões que NÃO ficam aqui (para não duplicar):
#   - Go:   diretiva "go" dos go.mod (backend/rotaperfumes-api e backend/shared).
#           Os scripts leem o go.mod e conferem que os dois módulos pedem a mesma versão.
#   - Node: frontend/.nvmrc (lido pelo nvm/nvm-windows); o mínimo aceito fica em
#           "engines" do frontend/package.json.

# Go: aceitar um patch local maior que o do go.mod (ex.: go.mod 1.26.0 e local 1.26.10).
# 1 = aceita a mesma série (1.26.x >= go.mod); 0 = exige exatamente a versão do go.mod.
GO_ACEITAR_PATCH_MAIOR=1

# Node: menor versão aceita (vite 8 pede >= 22.12; jsdom 29 pede >= 22.13; vitest 4 e next 16 aceitam 22).
NODE_MIN=22.13.0
# nvm (Linux, https://github.com/nvm-sh/nvm): versão do script de instalação oficial.
NVM_VERSAO=0.40.3

# MariaDB: o servidor do projeto é 11.4 LTS (CLAUDE.md, docs/manual-base-de-dados.md).
# O cliente "mariadb" precisa ser >= MARIADB_CLIENTE_MIN; abaixo disso o script avisa.
MARIADB_SERIE=11.4
MARIADB_CLIENTE_MIN=11.4

# govulncheck (make deps-audit-go). "latest" segue a recomendação do CLAUDE.md.
GOVULNCHECK_VERSAO=latest

# Postman CLI (testes da coleção em postman/): versão mínima aceita.
POSTMAN_CLI_MIN=1.0.0

# Mínimos das demais ferramentas.
GIT_MIN=2.30.0
MAKE_MIN=4.0
OPENSSL_MIN=3.0.0
